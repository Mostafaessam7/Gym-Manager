<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Gym Manager</title>
  <link rel="icon" type="image/svg+xml" href="Mecodex-Brand-Assets/SVG/mecodex-favicon.svg" />
  <link rel="alternate icon" href="Mecodex-Brand-Assets/Favicon-ICO/favicon.ico" />
  <script>
    // Applied synchronously, before the stylesheets paint, so a user who picked dark/light mode or a
    // language on the dashboard doesn't see the login page flash back to the OS/English default —
    // variables.css's dark theme and rtl.css's mirrored layout only kick in via these attributes (or the
    // prefers-color-scheme media query for theme), so this mirrors what js/i18n/index.js's initI18n() and
    // app.js's initTheme() do on the dashboard, keeping both entry points in sync from the same day one.
    (function () {
      try {
        var theme = localStorage.getItem('gym.theme');
        if (theme) document.documentElement.setAttribute('data-theme', theme);
        var locale = localStorage.getItem('gym.locale') || 'en';
        document.documentElement.setAttribute('lang', locale);
        document.documentElement.setAttribute('dir', locale === 'ar' ? 'rtl' : 'ltr');
      } catch { /* localStorage unavailable (e.g. blocked) — fall back to the OS-level media query / English */ }
    })();
  </script>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/rtl.css" />
  <style>
    .login-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, var(--color-primary-light), var(--color-bg) 60%);
      padding: var(--spacing-4);
      position: relative;
    }

    .login-toggles {
      position: absolute;
      top: var(--spacing-4);
      inset-inline-end: var(--spacing-4);
      display: flex;
      gap: var(--spacing-2);
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: var(--spacing-6);
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: var(--spacing-3);
      margin-bottom: var(--spacing-5);
    }

    .login-brand-mark {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--color-primary), #7c3aed);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .login-brand-mark img {
      width: 70%;
      height: 70%;
      object-fit: contain;
    }

    .login-brand-name {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .login-field {
      margin-bottom: var(--spacing-4);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .login-field label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-text-muted);
    }

    .login-field input {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
    }

    .login-submit {
      width: 100%;
      padding: 11px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--color-primary);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      margin-top: var(--spacing-2);
    }

    .login-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-error {
      background: var(--color-danger-light);
      color: var(--color-danger);
      border-radius: var(--radius-sm);
      padding: var(--spacing-3);
      font-size: 0.85rem;
      margin-bottom: var(--spacing-4);
    }

    .login-hint {
      margin-top: var(--spacing-4);
      font-size: 0.78rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-toggles">
      <button class="icon-btn" id="theme-toggle" type="button">&#9789;</button>
      <button class="icon-btn" id="lang-toggle" type="button">EN</button>
    </div>
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-mark">
          <img src="Mecodex-Brand-Assets/SVG/mecodex-icon.svg" alt="Gym Manager" />
        </div>
        <div class="login-brand-name">Gym Manager</div>
      </div>

      <div id="login-error" class="login-error hidden"></div>

      <form id="login-form">
        <div class="login-field">
          <label for="email" id="login-email-label">Email</label>
          <input type="email" id="email" name="email" autocomplete="username" required />
        </div>
        <div class="login-field">
          <label for="password" id="login-password-label">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="login-submit" id="login-submit">Sign in</button>
      </form>

      <p class="login-hint text-muted" id="login-hint">Default seeded account: admin@gymmanager.local</p>
    </div>
  </div>

  <script type="module" src="js/pages/loginPage.js"></script>
</body>
</html>

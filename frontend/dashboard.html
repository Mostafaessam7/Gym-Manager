<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Manager</title>
  <script>
    // Applied synchronously, before the stylesheets paint, to avoid a flash of the wrong theme/language —
    // see the matching comment in index.html. app.js's initTheme()/i18n's initI18n() re-apply the same
    // attributes on module load (harmless no-op if already set) and wire up the toggle buttons.
    (function () {
      try {
        var theme = localStorage.getItem('gym.theme');
        if (theme) document.documentElement.setAttribute('data-theme', theme);
        var locale = localStorage.getItem('gym.locale') || 'en';
        document.documentElement.setAttribute('lang', locale);
        document.documentElement.setAttribute('dir', locale === 'ar' ? 'rtl' : 'ltr');
      } catch { /* localStorage unavailable — fall back to the OS-level media query / English */ }
    })();
  </script>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/rtl.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <div class="sidebar__brand-mark">GM</div>
        <span>Gym Manager</span>
      </div>
      <nav class="sidebar__nav" id="sidebar-nav"></nav>
    </aside>

    <header class="topbar">
      <div style="display:flex; align-items:center; gap: var(--spacing-3);">
        <button class="icon-btn" id="menu-toggle" style="display:none;">&#9776;</button>
        <span class="topbar__title" id="page-title">Dashboard</span>
      </div>
      <div class="topbar__actions">
        <button class="icon-btn" id="theme-toggle" title="Toggle dark / light mode">&#9789;</button>
        <button class="icon-btn" id="lang-toggle" title="Toggle English / Arabic">EN</button>
        <div class="user-chip" id="user-chip">
          <div class="avatar" id="user-avatar">U</div>
          <span id="user-email" class="text-muted"></span>
        </div>
        <button class="btn btn-secondary btn-sm" id="logout-btn">Log out</button>
      </div>
    </header>

    <main class="main-content" id="main-content"></main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

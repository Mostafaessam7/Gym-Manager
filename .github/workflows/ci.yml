name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore GymManager.slnx

      - name: Check for vulnerable NuGet packages
        run: |
          report=$(dotnet list GymManager.slnx package --vulnerable --include-transitive 2>&1)
          echo "$report"
          if echo "$report" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet package(s) detected — see report above."
            exit 1
          fi

      - name: Build
        run: dotnet build GymManager.slnx --no-restore --configuration Release

      - name: Build Docker image
        run: docker build -f src/Presentation/GymManager.Api/Dockerfile -t gymmanager-api:ci .

      - name: Architecture tests
        run: dotnet test tests/GymManager.ArchitectureTests/GymManager.ArchitectureTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Unit tests
        run: dotnet test tests/GymManager.UnitTests/GymManager.UnitTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Integration tests
        run: dotnet test tests/GymManager.IntegrationTests/GymManager.IntegrationTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"
